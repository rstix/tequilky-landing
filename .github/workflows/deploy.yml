name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it — a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/configure-pages@v6.0.0

      # Publish the site files only — not the repo plumbing. Anything new
      # added to the repo is picked up automatically.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            ./ _site/
          # GitHub Pages caches every file for 10 minutes, so a browser could pair
          # new HTML with yesterday's stylesheet. Stamp the link with the commit.
          sed -i "s|href=\"styles.css\"|href=\"styles.css?v=${GITHUB_SHA::8}\"|" _site/*.html
          grep -o 'styles.css?v=[0-9a-f]*' _site/*.html
          echo "Publishing $(find _site -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
