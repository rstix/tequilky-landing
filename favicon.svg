<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Futsalový míč">
  <style>
    /* Fills live here — presentation attributes lose to these in the cascade.
       No dark-mode inversion: a ball is white with dark markings, which reads
       correctly on a light tab bar (the rim defines it) and on a dark one
       (the body carries it). Inverting turns the pentagon into a star. */
    .body { fill: #ffffff; }
    .rim  { fill: none; stroke: #0f0f0f; stroke-width: 2; }
    .pent { fill: #0f0f0f; stroke: none; }
    .seam { fill: none; stroke: #0f0f0f; stroke-width: 2; }
  </style>

  <circle class="body" cx="16" cy="16" r="13"/>

  <!-- seams first, so the rim and pentagon draw over their ends -->
  <g class="seam">
    <path d="M16 10 V4"/>
    <path d="M21.71 14.15 L27.41 12.29"/>
    <path d="M19.53 20.85 L23.05 25.71"/>
    <path d="M12.47 20.85 L8.95 25.71"/>
    <path d="M10.29 14.15 L4.59 12.29"/>
  </g>

  <path class="pent" d="M16 10 L21.71 14.15 L19.53 20.85 L12.47 20.85 L10.29 14.15 Z"/>
  <circle class="rim" cx="16" cy="16" r="13"/>
</svg>
